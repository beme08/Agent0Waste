[package]
name = "agent0waste"
version = "0.4.1"
edition = "2021"
authors = ["beme08"]
description = "Local-first waste scanner for AI agent CLIs (Hermes, Claude Code, etc.)"
license = "MIT"
repository = "https://github.com/beme08/Agent0Waste"
readme = "README.md"
keywords = ["ai", "agents", "cli", "local", "privacy"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
